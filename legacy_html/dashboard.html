<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overall Dashboard - Trail Running Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      padding: 1.5rem;
      text-align: center;
      background: linear-gradient(145deg, var(--bg-card) 0%, rgba(37, 99, 235, 0.1) 100%);
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-blue);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 1400px;">
    <div class="flex justify-between items-center" style="margin-bottom: 2rem;">
      <h2>Overall Dashboard</h2>
      <a href="index.html" class="btn" style="background-color: transparent; border: 1px solid var(--border-color);">Home</a>
    </div>

    <!-- Stats Summary -->
    <div class="stat-grid">
      <div class="card stat-card">
        <div class="stat-value" id="statCheckin">0%</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Checked In</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value" style="color: #eab308;">40%</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Station A1</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value" style="color: var(--success-green);">20%</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">Finished</div>
      </div>
      <div class="card stat-card">
        <div class="stat-value" style="color: #ef4444;">10%</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">DNS (Did Not Start)</div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="card table-wrapper">
      <table id="dashboardTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>BIB</th>
            <th>Check-in</th>
            <th>Start</th>
            <th>A1</th>
            <th>A2</th>
            <th>Finish</th>
            <th>Age Grp</th>
            <th>Grp Rank</th>
            <th>Overall</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function renderDashboard() {
      const data = JSON.parse(localStorage.getItem('runners')) || [];
      const tbody = document.querySelector('#dashboardTable tbody');
      tbody.innerHTML = '';
      
      let checkedInCount = 0;

      data.forEach(r => {
        if(r.status === 'CHECKED_IN') checkedInCount++;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight: 600;">${r.name}</td>
          <td><span style="color: var(--accent-blue);">${r.bib}</span></td>
          <td style="color: ${r.checkInTime ? 'var(--success-green)' : 'inherit'}">${r.checkInTime || '-'}</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>${r.ageGroup}</td>
          <td>-</td>
          <td>-</td>
        `;
        tbody.appendChild(tr);
      });

      const checkInPct = data.length ? Math.round((checkedInCount / data.length) * 100) : 0;
      document.getElementById('statCheckin').innerText = `${checkInPct}%`;
    }

    renderDashboard();
    
    // Auto-refresh when localStorage changes
    window.addEventListener('storage', () => {
      renderDashboard();
    });
  </script>
</body>
</html>
